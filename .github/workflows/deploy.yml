name: Deploy to GitHub Pages

on:
  # Automatically deploy on every push to the main branch
  push:
    branches:
      - main

  # Allows manual triggers directly from GitHub's Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent simultaneous deployments while allowing in-progress ones to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: ["ubuntu-latest","windows-latest","macOS-latest"]
        
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Upload static website files
        uses: actions/upload-pages-artifact@v3
        with:
          # Path to static assets (current directory)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
